# Las URLs del .env deben usar la IP de la red (ej. 192.168.1.94), no localhost,
# porque dentro del contenedor localhost es el propio contenedor y el navegador del celular tampoco lo resolvería.

services:
  panel-home:
    build: .
    container_name: panel-home
    restart: unless-stopped
    ports:
      - "8770:8770"   # panel web
    volumes:
      - ./data:/data   # aquí vive panel.db (eventos y consumo)
      # Solo para leer el estado de los contenedores (tarjeta Servidor y avisos si alguno se detiene)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - path: .env
        required: false   # TELEGRAM_TOKEN, TELEGRAM_CHAT_ID y las URLs de NetWatch/cámaras; ver .env.example
    environment:
      # Estas ganan sobre el .env
      TZ: America/Mexico_City
      PANEL_HOST: "0.0.0.0"
      PANEL_DB: /data/panel.db
      LUCES_ARCHIVO: /data/devices.json   # llaves de los focos (docs/LUCES.md); data/ no se sube a git
    logging:
      options:
        max-size: "10m"
        max-file: "3"
