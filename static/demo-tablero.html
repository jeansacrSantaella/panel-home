<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Demo Tablero — PleyadesHome</title>
  <link rel="stylesheet" href="/static/css/panel.css">
  <link rel="stylesheet" href="/static/css/orion.css">
  <style>
    body {
      background-color: #0B0F17;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 24px;
    }
    .demo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .tarjeta {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .tarjeta h2 {
      font-size: 0.9em;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin: 0;
      background: linear-gradient(90deg, #8B5CF6, #5aa8ff, #00E5FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tarjeta h2 small {
      font-weight: normal;
      color: rgba(255, 255, 255, 0.6);
      -webkit-text-fill-color: initial;
      margin-left: 8px;
    }
  </style>
</head>
<body>

  <h1 style="text-align: center; margin-bottom: 32px; font-weight: 400; letter-spacing: .05em;">
    Demo Componentes Tablero — <span style="background: linear-gradient(90deg, #8B5CF6, #5aa8ff, #00E5FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold;">PleyadesHome</span>
  </h1>

  <div class="demo-grid">

    <!-- 1. Anillo -->
    <div class="tarjeta">
      <h2>Anillo Segmentado <small>CPU Principal</small></h2>
      <div id="demo-anillo"></div>
    </div>

    <!-- 1b. Anillo con valor null -->
    <div class="tarjeta">
      <h2>Anillo Nulo <small>Sensor Desconectado</small></h2>
      <div id="demo-anillo-nulo"></div>
    </div>

    <!-- 2. Progreso -->
    <div class="tarjeta">
      <h2>Progreso <small>Almacenamiento</small></h2>
      <div id="demo-progreso"></div>
    </div>

    <!-- 3. Bloques -->
    <div class="tarjeta">
      <h2>Bloques <small>Carga de Servidores</small></h2>
      <div id="demo-bloques"></div>
    </div>

    <!-- 1c. Anillo en tarjeta angosta -->
    <div class="tarjeta" style="width: 180px;">
      <h2>Anillo <small>Angosta</small></h2>
      <div id="demo-anillo-angosto"></div>
    </div>

    <!-- 4b. Área densa -->
    <div class="tarjeta" style="grid-column: 1 / -1;">
      <h2>Área <small>48 puntos</small></h2>
      <div id="demo-area48"></div>
    </div>

    <!-- 5. Anillos múltiples -->
    <div class="tarjeta" style="grid-column: 1 / -1;">
      <h2>Anillos Múltiples <small>Estado de Red</small></h2>
      <div id="demo-anillos"></div>
    </div>

    <!-- 4. Área -->
    <div class="tarjeta" style="grid-column: 1 / -1;">
      <h2>Gráfica de Área <small>Tráfico de Red (24h)</small></h2>
      <div id="demo-area"></div>
    </div>

  </div>

  <script src="/static/js/hchart.js"></script>
  <script src="/static/js/hchart-tablero.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Anillo
      HChart.anillo(document.getElementById("demo-anillo"), {
        valor: 78.4,
        max: 100,
        etiqueta: "Uso actual"
      });

      // 1b. Anillo nulo
      HChart.anillo(document.getElementById("demo-anillo-nulo"), {
        valor: null,
        etiqueta: "Sin señal"
      });

      HChart.anillo(document.getElementById("demo-anillo-angosto"), { valor: 64, etiqueta: "Memoria", tamano: 160 });
      HChart.area(document.getElementById("demo-area48"),
        [{ nombre: "Latencia", puntos: Array.from({ length: 48 }, (_, i) => ({ x: (i * 0.5) + "h", y: 40 + Math.sin(i / 5) * 25 + Math.sin(i * 1.7) * 6 })) }],
        { marcas: [{ x: 0, etiqueta: "Inicio" }, { x: 20, etiqueta: "Pico" }, { x: 47, etiqueta: "Fin" }], formatoY: v => v + " ms", alto: 200 });

      // 2. Progreso
      HChart.progreso(document.getElementById("demo-progreso"), [
        { etiqueta: "Disco Principal (/)", valor: 450, max: 500, texto: "450 / 500 GB" },
        { etiqueta: "Memoria RAM", valor: 12.4, max: 16, texto: "12.4 / 16 GB" },
        { etiqueta: "Caché Redis", valor: 3.2, max: 8, texto: "3.2 GB" }
      ]);

      // 3. Bloques
      HChart.bloques(document.getElementById("demo-bloques"), [
        { etiqueta: "Core 01", valor: 85, max: 100 },
        { etiqueta: "Core 02", valor: 42, max: 100 },
        { etiqueta: "Core 03", valor: 95, max: 100 },
        { etiqueta: "Core 04", valor: 12, max: 100 }
      ], { bloques: 20 });

      // 5. Anillos múltiples
      HChart.anillos(document.getElementById("demo-anillos"), [
        { valor: 99.8, max: 100, etiqueta: "Internet", sufijo: "%" },
        { valor: 45.0, max: 100, etiqueta: "NAS Local", sufijo: "%" },
        { valor: 12.5, max: 100, etiqueta: "Docker", sufijo: "%" },
        { valor: 88.2, max: 100, etiqueta: "Proxy", sufijo: "%" }
      ]);

      // 4. Área (2 series de 24 puntos y 3 marcas)
      const puntosSerie1 = Array.from({ length: 24 }, (_, i) => ({ x: i + ":00", y: 20 + Math.sin(i / 3) * 15 + Math.random() * 10 }));
      const puntosSerie2 = Array.from({ length: 24 }, (_, i) => ({ x: i + ":00", y: 10 + Math.cos(i / 3) * 10 + Math.random() * 8 }));

      HChart.area(document.getElementById("demo-area"), [
        { nombre: "Bajada (Mbps)", puntos: puntosSerie1, color: "var(--marca-cian)" },
        { nombre: "Subida (Mbps)", puntos: puntosSerie2, color: "var(--marca-violeta)" }
      ], {
        marcas: [
          { x: 3, etiqueta: "Data 01" },
          { x: 12, etiqueta: "Data 02" },
          { x: 20, etiqueta: "Data 03" }
        ],
        formatoY: v => Math.round(v) + " Mb",
        alto: 240
      });
    });
  </script>

</body>
</html>
