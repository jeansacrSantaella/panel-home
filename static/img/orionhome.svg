<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- OrionHome (de la familia OrionGit, Santaella): Orión en reloj de arena; Sirius es la casa -->
  <defs>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185" />
    </clipPath>
    <radialGradient id="space" cx="50%" cy="42%" r="75%">
      <!-- Obsidiana #0B0F17 como tono dominante, apenas más claro tras la constelación -->
      <stop offset="0" stop-color="#121a2b" />
      <stop offset="0.5" stop-color="#0B0F17" />
      <stop offset="1" stop-color="#06080d" />
    </radialGradient>
    <radialGradient id="nebulaPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.32" />
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebulaCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.22" />
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="siriusHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="0.12" stop-color="#9ff6ff" stop-opacity="0.95" />
      <stop offset="0.35" stop-color="#00E5FF" stop-opacity="0.45" />
      <stop offset="0.7" stop-color="#8B5CF6" stop-opacity="0.18" />
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nodeHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="0.3" stop-color="#7cf0ff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="branch" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" />
      <stop offset="0.55" stop-color="#5aa8ff" />
      <stop offset="1" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.015" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6ecf7" stop-opacity="0.85" />
      <stop offset="0.3" stop-color="#5b6478" stop-opacity="0.5" />
      <stop offset="0.65" stop-color="#252a38" stop-opacity="0.6" />
      <stop offset="1" stop-color="#b9c4d8" stop-opacity="0.75" />
    </linearGradient>
    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Cuerpo del ícono -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#space)" />
  </g>

  <g clip-path="url(#squircle)">
    <!-- Nebulosa sutil -->
    <ellipse cx="380" cy="640" rx="260" ry="190" fill="url(#nebulaPurple)" filter="url(#blur40)" />
    <ellipse cx="700" cy="330" rx="230" ry="200" fill="url(#nebulaCyan)" filter="url(#blur40)" />
    <ellipse cx="560" cy="520" rx="320" ry="90" fill="url(#nebulaPurple)" opacity="0.5" filter="url(#blur40)" transform="rotate(-28 560 520)" />

    <!-- Polvo de estrellas -->
    <g fill="#ffffff">
      <circle cx="210" cy="250" r="2.2" opacity="0.7" />
      <circle cx="270" cy="420" r="1.6" opacity="0.5" />
      <circle cx="180" cy="560" r="2" opacity="0.55" />
      <circle cx="250" cy="820" r="1.8" opacity="0.45" />
      <circle cx="330" cy="200" r="1.5" opacity="0.5" />
      <circle cx="470" cy="180" r="2" opacity="0.6" />
      <circle cx="540" cy="260" r="1.4" opacity="0.4" />
      <circle cx="860" cy="470" r="2.2" opacity="0.6" />
      <circle cx="820" cy="640" r="1.6" opacity="0.45" />
      <circle cx="760" cy="820" r="2" opacity="0.55" />
      <circle cx="560" cy="860" r="1.5" opacity="0.4" />
      <circle cx="450" cy="400" r="1.3" opacity="0.4" />
      <circle cx="690" cy="560" r="1.4" opacity="0.45" />
      <circle cx="320" cy="640" r="1.3" opacity="0.4" />
      <circle cx="880" cy="230" r="1.6" opacity="0.5" />
      <circle cx="660" cy="170" r="1.3" opacity="0.4" />
    </g>

    <!-- Orión en reloj de arena: hombros (Betelgeuse, Bellatrix), cinturón alineado y pies (Saiph, Rigel) -->
    <g fill="none" stroke="url(#branch)" stroke-width="6.5" stroke-linecap="round" filter="url(#glow)">
      <path d="M318 292 Q 371 426, 397 568" />
      <path d="M566 310 Q 514 398, 483 496" />
      <path d="M397 568 L 440 532 L 483 496" />
      <path d="M397 568 Q 344 664, 316 770" />
      <path d="M483 496 Q 538 620, 570 752" />
      <path d="M318 292 Q 443 291, 566 310" />
      <path d="M316 770 Q 444 771, 570 752" />
    </g>
    <!-- Rumbo del cinturón hacia Sirius (la casa) -->
    <path d="M506 477 L 714 303" fill="none" stroke="#7cf0ff" stroke-opacity="0.55" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 13" />
    <!-- Estrellas de Orión -->
    <g>
      <circle cx="318" cy="292" r="42" fill="url(#nodeHalo)" />
      <circle cx="566" cy="310" r="42" fill="url(#nodeHalo)" />
      <circle cx="316" cy="770" r="42" fill="url(#nodeHalo)" />
      <circle cx="570" cy="752" r="42" fill="url(#nodeHalo)" />
      <circle cx="397" cy="568" r="58" fill="url(#nodeHalo)" />
      <circle cx="440" cy="532" r="58" fill="url(#nodeHalo)" />
      <circle cx="483" cy="496" r="58" fill="url(#nodeHalo)" />
    </g>
    <g fill="#f4fdff" stroke="#00E5FF" stroke-width="3">
      <circle cx="318" cy="292" r="12" />
      <circle cx="566" cy="310" r="12" />
      <circle cx="316" cy="770" r="12" />
      <circle cx="570" cy="752" r="12" />
      <circle cx="397" cy="568" r="15" />
      <circle cx="440" cy="532" r="15" />
      <circle cx="483" cy="496" r="15" />
    </g>

    <!-- Sirius: estrella de cuatro puntas, la casa -->
    <g transform="translate(768 258)">
      <circle r="150" fill="url(#siriusHalo)" />
      <path d="M0 -112 C 9 -28, 28 -9, 112 0 C 28 9, 9 28, 0 112 C -9 28, -28 9, -112 0 C -28 -9, -9 -28, 0 -112 Z"
            fill="#eaffff" filter="url(#glow)" />
      <path d="M0 -56 C 5 -15, 15 -5, 56 0 C 15 5, 5 15, 0 56 C -5 15, -15 5, -56 0 C -15 -5, -5 -15, 0 -56 Z"
            fill="#ffffff" transform="rotate(45)" opacity="0.5" />
      <circle r="13" fill="#ffffff" />
    </g>

    <!-- Brillo de vidrio superior -->
    <rect x="100" y="100" width="824" height="420" fill="url(#glass)" />
  </g>

  <!-- Borde metálico -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" ry="184" fill="none" stroke="url(#rim)" stroke-width="3" />
</svg>
