<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- PleyadesHome (familia Astreo, Santaella): las Pléyades (M45); Alcyone, la más brillante, es la casa -->
  <defs>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185" />
    </clipPath>
    <radialGradient id="space" cx="50%" cy="42%" r="75%">
      <!-- Obsidiana #0B0F17 como tono dominante, apenas más claro tras la constelación -->
      <stop offset="0" stop-color="#121a2b" />
      <stop offset="0.5" stop-color="#0B0F17" />
      <stop offset="1" stop-color="#06080d" />
    </radialGradient>
    <radialGradient id="nebulaPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.32" />
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebulaCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.22" />
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="siriusHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="0.12" stop-color="#9ff6ff" stop-opacity="0.95" />
      <stop offset="0.35" stop-color="#00E5FF" stop-opacity="0.45" />
      <stop offset="0.7" stop-color="#8B5CF6" stop-opacity="0.18" />
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nodeHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="0.3" stop-color="#7cf0ff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="branch" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" />
      <stop offset="0.55" stop-color="#5aa8ff" />
      <stop offset="1" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.015" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6ecf7" stop-opacity="0.85" />
      <stop offset="0.3" stop-color="#5b6478" stop-opacity="0.5" />
      <stop offset="0.65" stop-color="#252a38" stop-opacity="0.6" />
      <stop offset="1" stop-color="#b9c4d8" stop-opacity="0.75" />
    </linearGradient>
    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Cuerpo del ícono -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#space)" />
  </g>

  <g clip-path="url(#squircle)">
    <!-- Nebulosa sutil -->
    <ellipse cx="380" cy="640" rx="260" ry="190" fill="url(#nebulaPurple)" filter="url(#blur40)" />
    <ellipse cx="700" cy="330" rx="230" ry="200" fill="url(#nebulaCyan)" filter="url(#blur40)" />
    <ellipse cx="560" cy="520" rx="320" ry="90" fill="url(#nebulaPurple)" opacity="0.5" filter="url(#blur40)" transform="rotate(-28 560 520)" />

    <!-- Polvo de estrellas -->
    <g fill="#ffffff">
      <circle cx="210" cy="250" r="2.2" opacity="0.7" />
      <circle cx="270" cy="420" r="1.6" opacity="0.5" />
      <circle cx="180" cy="560" r="2" opacity="0.55" />
      <circle cx="250" cy="820" r="1.8" opacity="0.45" />
      <circle cx="330" cy="200" r="1.5" opacity="0.5" />
      <circle cx="470" cy="180" r="2" opacity="0.6" />
      <circle cx="540" cy="260" r="1.4" opacity="0.4" />
      <circle cx="860" cy="470" r="2.2" opacity="0.6" />
      <circle cx="820" cy="640" r="1.6" opacity="0.45" />
      <circle cx="760" cy="820" r="2" opacity="0.55" />
      <circle cx="560" cy="860" r="1.5" opacity="0.4" />
      <circle cx="450" cy="400" r="1.3" opacity="0.4" />
      <circle cx="690" cy="560" r="1.4" opacity="0.45" />
      <circle cx="320" cy="640" r="1.3" opacity="0.4" />
      <circle cx="880" cy="230" r="1.6" opacity="0.5" />
      <circle cx="660" cy="170" r="1.3" opacity="0.4" />
    </g>

    <!-- Nebulosa de reflexión azul de las Pléyades -->
    <ellipse cx="520" cy="530" rx="330" ry="260" fill="url(#nebulaCyan)" filter="url(#blur40)" opacity=".9"/>
    <!-- Figura de las Pléyades (la "pequeña osa") -->
    <g fill="none" stroke="url(#branch)" stroke-width="5.5" stroke-linecap="round" filter="url(#glow)">
      <path d="M251 545 L 246 586"/>
      <path d="M246 586 L 438 607"/>
      <path d="M438 607 L 542 737"/>
      <path d="M542 737 L 724 565"/>
      <path d="M724 565 L 656 451"/>
      <path d="M656 451 L 438 607"/>
      <path d="M656 451 L 724 373"/>
      <path d="M724 373 L 698 285"/>
      <path d="M724 565 L 802 503"/>
    </g>
    <!-- Las hermanas: halo y estrella, tamaño según su brillo -->
    <g>
      <circle cx="246" cy="586" r="51" fill="url(#nodeHalo)"/>
      <circle cx="251" cy="545" r="31" fill="url(#nodeHalo)"/>
      <circle cx="542" cy="737" r="41" fill="url(#nodeHalo)"/>
      <circle cx="724" cy="565" r="48" fill="url(#nodeHalo)"/>
      <circle cx="656" cy="451" r="44" fill="url(#nodeHalo)"/>
      <circle cx="724" cy="373" r="37" fill="url(#nodeHalo)"/>
      <circle cx="802" cy="503" r="27" fill="url(#nodeHalo)"/>
      <circle cx="698" cy="285" r="24" fill="url(#nodeHalo)"/>
    </g>
    <g fill="#f4fdff" stroke="#00E5FF" stroke-width="3">
      <circle cx="246" cy="586" r="15"/>  <!-- Atlas -->
      <circle cx="251" cy="545" r="9"/>  <!-- Pleione -->
      <circle cx="542" cy="737" r="12"/>  <!-- Merope -->
      <circle cx="724" cy="565" r="14"/>  <!-- Electra -->
      <circle cx="656" cy="451" r="13"/>  <!-- Maia -->
      <circle cx="724" cy="373" r="11"/>  <!-- Taygeta -->
      <circle cx="802" cy="503" r="8"/>  <!-- Celaeno -->
      <circle cx="698" cy="285" r="7"/>  <!-- Asterope -->
    </g>

    <!-- Alcyone: estrella de cuatro puntas, la casa -->
    <g transform="translate(438 607)">
      <circle r="135" fill="url(#siriusHalo)" />
      <path d="M0 -100 C 8 -25, 25 -8, 100 0 C 25 8, 8 25, 0 100 C -8 25, -25 8, -100 0 C -25 -8, -8 -25, 0 -100 Z" fill="#eaffff" filter="url(#glow)" />
      <path d="M0 -50 C 4 -13, 13 -4, 50 0 C 13 4, 4 13, 0 50 C -4 13, -13 4, -50 0 C -13 -4, -4 -13, 0 -50 Z" fill="#ffffff" transform="rotate(45)" opacity="0.5" />
      <circle r="12" fill="#ffffff" />
    </g>

    <!-- Brillo de vidrio superior -->
    <rect x="100" y="100" width="824" height="420" fill="url(#glass)" />
  </g>

  <!-- Borde metálico -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" ry="184" fill="none" stroke="url(#rim)" stroke-width="3" />
</svg>
